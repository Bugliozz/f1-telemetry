services:
  mosquitto:
    image: eclipse-mosquitto:2.0.18
    container_name: f1-mosquitto
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -p 1883 -t '$$SYS/#' -C 1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7.0
    container_name: f1-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - ./mongo/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  nodered:
    image: nodered/node-red:3.1.5
    container_name: f1-nodered
    ports:
      - "1880:1880"
    volumes:
      - ./node-red/data:/data
    depends_on:
      mosquitto:
        condition: service_healthy
      mongodb:
        condition: service_healthy

  simulator:
    build:
      context: ./simulator
    container_name: f1-simulator
    environment:
      - MQTT_BROKER=mqtt://mosquitto:1883
    depends_on:
      mosquitto:
        condition: service_healthy

volumes:
  mongodb_data:
