services:
  mosquitto:
    image: eclipse-mosquitto:2.0.18
    container_name: f1-final-mosquitto
    ports:
      - "1884:1883"
      - "9002:9001"
    volumes:
      - ./mosquitto/config:/mosquitto/config:ro
      - f1-final-mosquitto-data:/mosquitto/data
      - f1-final-mosquitto-log:/mosquitto/log
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -p 1883 -t '$$SYS/#' -C 1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - f1-final-network

  mongodb:
    image: mongo:7.0
    container_name: f1-final-mongodb
    ports:
      - "27018:27017"
    volumes:
      - f1-final-mongo-data:/data/db
      - ./mongo/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - f1-final-network

  nodered:
    build:
      context: ./node-red
    container_name: f1-final-nodered
    ports:
      - "1881:1880"
    env_file:
      - .env.delivery
    volumes:
      - ./node-red/data:/data
    depends_on:
      mosquitto:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    networks:
      - f1-final-network

  simulator:
    build:
      context: ./simulator
    container_name: f1-final-simulator
    environment:
      - MQTT_BROKER=mqtt://mosquitto:1883
      - MONGO_URL=mongodb://mongodb:27017
      - MONGO_DB=f1_telemetry
      - RESET_RACE_ON_START=true
      - RACE_ID=1
      - TOTAL_LAPS=5
      - TICK_MS=250
      - LOG_LEVEL=info
    depends_on:
      mosquitto:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    networks:
      - f1-final-network

networks:
  f1-final-network:
    name: f1-final-network

volumes:
  f1-final-mongo-data:
    name: f1-final-mongo-data
  f1-final-mosquitto-data:
    name: f1-final-mosquitto-data
  f1-final-mosquitto-log:
    name: f1-final-mosquitto-log
