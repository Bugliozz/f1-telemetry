# =====================================================================
# F1 Telemetry — Eclipse Mosquitto 2.x
# =====================================================================
# MQTT listener on 1883 (TCP) and 9001 (WebSocket for the browser dashboard).
# Authentication: anonymous in development, but traffic is restricted to
# the f1/# subtree via acl_file.
# =====================================================================

# --- Persistence and logging -----------------------------------------
persistence true
persistence_location /mosquitto/data/

log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true

# --- Connection and throughput limits --------------------------------
# The simulator publishes up to 10 cars * 5 Hz = 50 msg/s on f1/#:
# wide margin to avoid back-pressure.
max_keepalive 60
max_inflight_messages 100
max_queued_messages 1000

# --- Native TCP listener (simulator, Node-RED, mosquitto_pub/sub) ----
listener 1883 0.0.0.0
protocol mqtt

# --- Listener WebSocket (dashboard browser) --------------------------
listener 9001 0.0.0.0
protocol websockets

# --- Authentication and ACL ------------------------------------------
# Development: no password, but the ACL file restricts anonymous clients
# to the project subtree only.
allow_anonymous true
acl_file /mosquitto/config/acl.conf
