# =====================================================================
# F1 Telemetry — Eclipse Mosquitto 2.x
# =====================================================================
# Listener MQTT su 1883 (TCP) e 9001 (WebSocket per la dashboard browser).
# Autenticazione: anonima in sviluppo, ma il traffico è limitato al
# sottoalbero f1/# tramite acl_file.
# =====================================================================

# --- Persistenza e logging -------------------------------------------
persistence true
persistence_location /mosquitto/data/

log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true

# --- Limiti di connessione e throughput ------------------------------
# Il simulatore pubblica fino a 10 auto * 5 Hz = 50 msg/s su f1/#:
# margine ampio per evitare back-pressure.
max_keepalive 60
max_inflight_messages 100
max_queued_messages 1000

# --- Listener TCP nativo (simulatore, Node-RED, mosquitto_pub/sub) ---
listener 1883 0.0.0.0
protocol mqtt

# --- Listener WebSocket (dashboard browser) --------------------------
listener 9001 0.0.0.0
protocol websockets

# --- Autenticazione e ACL --------------------------------------------
# Sviluppo: nessuna password, ma il file ACL limita i client anonimi
# al solo sottoalbero del progetto.
allow_anonymous true
acl_file /mosquitto/config/acl.conf
