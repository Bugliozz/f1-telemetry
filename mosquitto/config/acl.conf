# =====================================================================
# F1 Telemetry — Mosquitto ACL
# =====================================================================
# In sviluppo i client si connettono anonimamente. Le regole `topic`
# senza un blocco `user` precedente si applicano a TUTTI i client
# (inclusi gli anonimi): privilegio minimo, traffico confinato a f1/#.
# =====================================================================

# Sottoalbero del progetto: lettura e scrittura
topic readwrite f1/#

# Topic interni del broker: sola lettura, utili per healthcheck/monitor
topic read $SYS/#
