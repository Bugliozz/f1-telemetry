# =====================================================================
# F1 Telemetry — Mosquitto ACL
# =====================================================================
# In sviluppo i client si connettono in anonimo. Le regole `topic`
# senza un blocco `user` precedente si applicano a TUTTI i client
# (anonimi inclusi): minimo privilegio, traffico confinato a f1/#.
# =====================================================================

# Sotto-albero del progetto: lettura e scrittura
topic readwrite f1/#

# Topic interni del broker: solo lettura, utili per healthcheck/monitor
topic read $SYS/#
