# =====================================================================
# F1 Telemetry — Mosquitto ACL
# =====================================================================
# In development, clients connect anonymously. `topic` rules without
# a preceding `user` block apply to ALL clients (including anonymous
# ones): least privilege, traffic confined to f1/#.
# =====================================================================

# Project subtree: read and write
topic readwrite f1/#

# Internal broker topics: read-only, useful for healthcheck/monitoring
topic read $SYS/#
