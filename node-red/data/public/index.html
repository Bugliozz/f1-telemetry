<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>F1 Telemetry — Monza</title>
    <link rel="stylesheet" href="dashboard.css?v=20260505-track-names" />
</head>
<body>
    <div id="scenario-modal" class="scenario-modal" role="dialog" aria-modal="true" aria-labelledby="scenario-title">
        <div class="scenario-modal__panel">
            <div class="scenario-modal__eyebrow">Race setup</div>
            <h2 id="scenario-title">Choose scenario</h2>
            <div class="scenario-options" aria-label="Race scenarios">
                <button class="scenario-option scenario-option--red" type="button" data-scenario="red-flag" disabled>
                    <span class="scenario-option__title">Failure likely</span>
                    <span class="scenario-option__meta">High risk after lap 3</span>
                </button>
                <button class="scenario-option scenario-option--balanced" type="button" data-scenario="balanced" disabled>
                    <span class="scenario-option__title">Balanced</span>
                    <span class="scenario-option__meta">Five-lap race balance</span>
                </button>
            </div>
            <div id="scenario-status" class="scenario-modal__status">connecting...</div>
        </div>
    </div>

    <header class="dashboard-header">
        <h1>F1 Telemetry — Monza</h1>
        <div class="status-bar">
            <span id="connection-status" class="status-pill status-pill--idle">disconnected</span>
            <span id="snapshot-info" class="status-pill status-pill--muted">waiting for data…</span>
        </div>
    </header>

    <main class="dashboard-main">
        <section class="circuit-panel" aria-label="Monza circuit map">
            <div id="circuit-container" class="circuit-container">
                <!-- The SVG is fetched and injected into this container at runtime so
                     getPointAtLength() can resolve coordinates from trackPos. -->
            </div>
            <div class="map-legend" aria-label="Team legend">
                <h2>Teams</h2>
                <ul id="legend" class="legend"></ul>
            </div>
        </section>

        <aside class="sidebar">
            <div class="panel race-control-panel" aria-label="Race Control">
                <h2>Race Control</h2>
                <div id="flag-indicator" class="flag-indicator flag-indicator--idle" data-flag="">
                    <span class="flag-indicator__lamp" aria-hidden="true"></span>
                    <div class="flag-indicator__body">
                        <div id="flag-label" class="flag-indicator__label">No active flag</div>
                        <div id="flag-meta" class="flag-indicator__meta">waiting for race control</div>
                    </div>
                </div>
                <div id="flag-effect-grid" class="flag-effect-grid"></div>
                <div class="race-progress" aria-label="Race progress">
                    <div class="race-progress__head">
                        <span id="race-progress-label" class="race-progress__label">Lap -- / 5</span>
                        <span id="race-progress-percent" class="race-progress__percent">0%</span>
                    </div>
                    <div id="race-progress-track" class="race-progress__track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
                        <span id="race-progress-bar" class="race-progress__bar"></span>
                    </div>
                </div>
            </div>

            <div class="panel leaderboard-panel" aria-label="Live Leaderboard">
                <h2>Leaderboard</h2>
                <div class="table-container">
                    <table class="leaderboard-table">
                        <thead>
                            <tr>
                                <th>Pos</th>
                                <th>Car</th>
                                <th style="text-align:right">Gap</th>
                            </tr>
                        </thead>
                        <tbody id="leaderboard-body">
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="panel car-state-panel" aria-label="Car States">
                <h2>Car States</h2>
                <div id="car-states-container" class="car-states-grid"></div>
            </div>

            <div class="panel race-events-panel" aria-label="Race Events">
                <h2>Race Events</h2>
                <ol id="race-event-log" class="race-event-log" aria-live="polite"></ol>
            </div>
        </aside>
    </main>

    <script src="dashboard.js?v=20260505-track-names"></script>
</body>
</html>
